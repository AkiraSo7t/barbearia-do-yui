<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Entrar</title>
    <!-- Estilo comum e ajustes específicos deste formulário. -->
    <link rel="stylesheet" href="../form.css" />
    <link rel="stylesheet" href="login.css?v=demo-2" />
    <script src="../../assets/api.js?v=api-2" defer></script>
    <script src="../form.js?v=plan-entry-1" defer></script>
    <script src="login.js?v=plan-entry-1" defer></script>
  </head>
  <body>
    <div class="iridescence" aria-hidden="true"></div>
    <a class="back-to-site" href="../../Landpage/index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m14 6-6 6 6 6" />
        <path d="M8 12h12" />
      </svg>
      <span>Voltar ao site</span>
    </a>
    <main class="login-stage">
      <section class="glass-panel" aria-labelledby="login-title">
        <header class="panel-heading">
          <h1 id="login-title">Entrar</h1>
          <p>Boas-vindas de volta</p>
        </header>
        <form id="login-form" novalidate>
          <div class="fields">
            <div class="field">
              <label class="sr-only" for="username">CPF, nome completo ou usuário</label>
              <input
                id="username"
                name="username"
                type="text"
                placeholder="CPF, nome completo ou usuário"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
                aria-describedby="username-error"
              />
              <svg class="field-icon" viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="10" r="7" />
                <path d="M3 30c0-8 5.5-12 13-12s13 4 13 12" />
              </svg>
            </div>
            <p class="field-error" id="username-error" hidden></p>
            <div class="field">
              <label class="sr-only" for="password">Senha</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Senha"
                autocomplete="current-password"
                required
                aria-describedby="password-error"
              />
              <button
                class="password-toggle"
                type="button"
                aria-label="Mostrar senha"
                aria-controls="password"
                aria-pressed="false"
              >
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <path
                    d="M3 12c3-4 7-6 13-6 5 0 9 2 13 6M3 16s4 10 13 10c4 0 7-1.8 10-5M6 8c-1.2 1.4-2.2 3-3 5M11 11a7 7 0 0 0 10 10"
                  />
                  <path class="eye-slash" d="m2 2 28 28" />
                  <path class="eye-open" d="M3 16s4-10 13-10 13 10 13 10-4 10-13 10S3 16 3 16Z" />
                  <circle class="eye-open" cx="16" cy="16" r="5" />
                </svg>
              </button>
            </div>
            <p class="field-error" id="password-error" hidden></p>
          </div>
          <label class="remember" for="remember">
            <input id="remember" name="remember" type="checkbox" />
            <span>Lembrar de mim</span>
          </label>
          <div class="form-actions">
            <button class="login-button" type="submit">Entrar</button>
            <p class="signup-line">
              Não tem uma conta?
              <a class="signup-link" href="../Cadastre/cadastro.html">Cadastre-se</a>
            </p>
          </div>
          <p class="form-status" role="status" aria-live="polite" hidden></p>
        </form>
        <p class="demo-credentials">
          <span>ACESSO DE DEMONSTRAÇÃO</span><br />Barbeiro: <strong>barbeiro.guren</strong> /
          <strong>Barbeiro@123</strong><br />Administrador: <strong>admin.guren</strong> /
          <strong>Admin@123</strong>
        </p>
        <noscript
          ><p class="noscript-note">
            Ative o JavaScript para usar os controles de acesso.
          </p></noscript
        >
      </section>
    </main>
  </body>
</html>
