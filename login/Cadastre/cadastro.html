<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Criar conta</title>
    <!-- Estilo comum e ajustes específicos deste formulário. -->
    <link rel="stylesheet" href="../form.css" />
    <link rel="stylesheet" href="cadastro.css?v=cadastro-4" />
    <script src="../../assets/api.js?v=api-1" defer></script>
    <script src="../form.js?v=plan-entry-1" defer></script>
    <script src="cadastro.js?v=plan-entry-1" defer></script>
  </head>
  <body>
    <div class="iridescence" aria-hidden="true"></div>
    <a class="back-to-site" href="../../Landpage/index.html"
      ><svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m14 6-6 6 6 6" />
        <path d="M8 12h12" /></svg
      ><span>Voltar ao site</span></a
    >
    <main class="login-stage">
      <section class="glass-panel" aria-labelledby="signup-title">
        <header class="panel-heading">
          <h1 id="signup-title">Criar conta</h1>
          <p>Faça seu cadastro</p>
        </header>
        <form id="signup-form" novalidate>
          <div class="fields">
            <div class="field">
              <label class="sr-only" for="signup-name">Nome</label
              ><input
                id="signup-name"
                name="name"
                type="text"
                placeholder="Nome completo"
                autocomplete="name"
                required
                aria-describedby="signup-name-error"
              /><svg class="field-icon" viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="10" r="7" />
                <path d="M3 30c0-8 5.5-12 13-12s13 4 13 12" />
              </svg>
            </div>
            <p class="field-error" id="signup-name-error" hidden></p>
            <div class="field">
              <label class="sr-only" for="signup-phone">Número de telefone</label
              ><input
                id="signup-phone"
                name="phone"
                type="tel"
                placeholder="Número de telefone"
                autocomplete="tel"
                inputmode="tel"
                maxlength="15"
                required
                aria-describedby="signup-phone-error"
              />
            </div>
            <p class="field-error" id="signup-phone-error" hidden></p>
            <div class="field">
              <label class="sr-only" for="signup-whatsapp">WhatsApp</label
              ><input
                id="signup-whatsapp"
                name="whatsapp"
                type="tel"
                placeholder="WhatsApp"
                inputmode="tel"
                maxlength="15"
                required
                aria-describedby="signup-whatsapp-error"
              />
            </div>
            <p class="field-error" id="signup-whatsapp-error" hidden></p>
            <div class="field">
              <label class="sr-only" for="signup-cpf">CPF</label
              ><input
                id="signup-cpf"
                name="cpf"
                type="text"
                placeholder="CPF"
                autocomplete="off"
                inputmode="numeric"
                maxlength="14"
                required
                aria-describedby="signup-cpf-error"
              />
            </div>
            <p class="field-error" id="signup-cpf-error" hidden></p>
            <div class="field">
              <label class="sr-only" for="signup-password">Senha</label
              ><input
                id="signup-password"
                name="password"
                type="password"
                placeholder="Senha (mínimo 8 caracteres)"
                autocomplete="new-password"
                minlength="8"
                required
                aria-describedby="signup-password-error"
              /><button
                class="password-toggle"
                type="button"
                aria-label="Mostrar senha"
                aria-controls="signup-password"
                aria-pressed="false"
              >
                <svg viewBox="0 0 32 32" aria-hidden="true">
                  <path
                    d="M3 12c3-4 7-6 13-6 5 0 9 2 13 6M3 16s4 10 13 10c4 0 7-1.8 10-5M6 8c-1.2 1.4-2.2 3-3 5"
                  />
                  <path class="eye-slash" d="m2 2 28 28" />
                  <path class="eye-open" d="M3 16s4-10 13-10 13 10 13 10-4 10-13 10S3 16 3 16Z" />
                  <circle class="eye-open" cx="16" cy="16" r="5" />
                </svg>
              </button>
            </div>
            <p class="field-error" id="signup-password-error" hidden></p>
            <div class="field">
              <label class="sr-only" for="signup-confirm">Confirmar senha</label
              ><input
                id="signup-confirm"
                name="confirm"
                type="password"
                placeholder="Confirmar senha"
                autocomplete="new-password"
                required
                aria-describedby="signup-confirm-error"
              />
            </div>
            <p class="field-error" id="signup-confirm-error" hidden></p>
          </div>
          <div class="form-actions">
            <button class="login-button" type="submit">Criar conta</button>
            <p class="signup-line">
              Já tem uma conta? <a class="signup-link" href="../login/login.html">Entrar</a>
            </p>
          </div>
          <p class="form-status" role="status" aria-live="polite" hidden></p>
        </form>
        <noscript><p class="noscript-note">Ative o JavaScript para usar o formulário.</p></noscript>
      </section>
    </main>
  </body>
</html>
